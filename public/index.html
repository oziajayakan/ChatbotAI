<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NOVA — AI Assistant</title>
<meta name="theme-color" content="#0b0d13" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
<style>
  :root {
    --bg: #0b0d13;
    --bg-side: #10131c;
    --surface: #161a26;
    --surface-2: #1e2333;
    --surface-hover: #252b3d;
    --text: #f1f5f9;
    --text-soft: #cbd5e1;
    --muted: #8b98b1;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.14);
    --accent: #6366f1;
    --accent-2: #14b8a6;
    --accent-soft: rgba(99, 102, 241, 0.14);
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --warn: #f59e0b;
    --danger: #ef4444;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
    --shadow-md: 0 10px 30px -10px rgba(0, 0, 0, 0.45);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 9px;
  }

  :root[data-theme="light"] {
    --bg: #f8fafc;
    --bg-side: #f1f5f9;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --surface-hover: #e2e8f0;
    --text: #0f172a;
    --text-soft: #334155;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.08);
    --line-strong: rgba(15, 23, 42, 0.15);
    --accent: #4f46e5;
    --accent-2: #0d9488;
    --accent-soft: rgba(79, 70, 229, 0.1);
    --user-bubble: #4f46e5;
    --user-text: #ffffff;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 12px 32px -12px rgba(15, 23, 42, 0.12);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- Full-Screen Responsive Layout ---------- */
  .layout {
    position: relative;
    width: 100vw;
    height: 100dvh;
    display: flex;
    overflow: hidden;
    background: var(--bg);
  }

  /* ---------- Sidebar (Full Height, Collapsible on PC & Mobile) ---------- */
  .sidebar {
    width: 310px;
    height: 100%;
    flex: none;
    display: flex;
    flex-direction: column;
    background: var(--bg-side);
    border-right: 1px solid var(--line);
    transition: margin-left 0.28s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 30;
  }

  .layout.sidebar-collapsed .sidebar {
    margin-left: -310px;
  }

  .side-header {
    height: 64px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    flex: none;
  }

  .side-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: -0.01em;
  }

  .side-brand svg {
    color: var(--accent);
  }

  .db-badge {
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(99, 102, 241, 0.25);
    font-weight: 500;
  }

  .side-top-actions {
    padding: 14px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: none;
  }

  .new-chat-btn {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
    font: 600 13.5px 'Plus Jakarta Sans', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    transition: all 0.18s ease;
  }

  .new-chat-btn:hover {
    background: var(--surface-2);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .new-chat-left {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .new-chat-btn svg {
    width: 16px;
    height: 16px;
    color: var(--accent);
  }

  .kbd-hint {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--bg-side);
    border: 1px solid var(--line);
  }

  .search-box {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-box svg {
    position: absolute;
    left: 11px;
    width: 15px;
    height: 15px;
    color: var(--muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 8.5px 12px 8.5px 34px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: 400 12.5px 'Plus Jakarta Sans', sans-serif;
    outline: none;
    transition: border-color 0.18s;
  }

  .search-input:focus {
    border-color: var(--accent);
  }

  .search-input::placeholder {
    color: var(--muted);
  }

  .side-section-label {
    padding: 6px 16px 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .conv-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .conv-list::-webkit-scrollbar {
    width: 5px;
  }

  .conv-list::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border-radius: 6px;
  }

  .conv-empty {
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    padding: 36px 16px;
    line-height: 1.6;
  }

  .conv-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .conv-item:hover {
    background: var(--surface);
    border-color: var(--line);
  }

  .conv-item.active {
    background: var(--surface-2);
    border-color: var(--line-strong);
  }

  .conv-info {
    flex: 1;
    min-width: 0;
  }

  .conv-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .conv-item.active .conv-name {
    font-weight: 600;
    color: var(--accent);
  }

  :root:not([data-theme="light"]) .conv-item.active .conv-name {
    color: #a5b4fc;
  }

  .conv-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .conv-actions {
    display: flex;
    gap: 2px;
    flex: none;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .conv-item:hover .conv-actions,
  .conv-item.active .conv-actions {
    opacity: 1;
  }

  .mini-btn {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.15s;
  }

  .mini-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .mini-btn.del:hover {
    color: var(--danger);
    background: rgba(239, 68, 68, 0.12);
  }

  .mini-btn svg {
    width: 13.5px;
    height: 13.5px;
  }

  .side-footer {
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 9px;
    background: var(--bg-side);
    flex: none;
  }

  .clear-all-btn {
    width: 100%;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font: 500 12px 'Plus Jakarta Sans', sans-serif;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .clear-all-btn:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(239, 68, 68, 0.06);
  }

  .clear-all-btn svg {
    width: 14px;
    height: 14px;
  }

  .side-links {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .ext-link {
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-soft);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.18s;
  }

  .ext-link:hover {
    border-color: var(--line-strong);
    background: var(--surface-2);
    color: var(--text);
  }

  .ext-link.saweria {
    color: var(--warn);
    border-color: rgba(245, 158, 11, 0.28);
    background: rgba(245, 158, 11, 0.08);
  }

  .ext-link.saweria:hover {
    background: rgba(245, 158, 11, 0.15);
    border-color: rgba(245, 158, 11, 0.45);
  }

  .ext-link svg {
    width: 14px;
    height: 14px;
    flex: none;
  }

  /* ---------- Main Workspace (Full Screen Width & Height) ---------- */
  .app {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse 80% 50% at 50% -15%, rgba(99, 102, 241, 0.09), transparent),
      radial-gradient(ellipse 60% 40% at 90% 100%, rgba(20, 184, 166, 0.06), transparent),
      var(--bg);
  }

  /* ---------- Top Header Bar ---------- */
  header {
    height: 64px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 13, 19, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    flex: none;
    z-index: 10;
  }

  :root[data-theme="light"] header {
    background: rgba(248, 250, 252, 0.8);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid;
    place-items: center;
    color: #fff;
    flex: none;
    box-shadow: 0 4px 14px -3px rgba(99, 102, 241, 0.45);
  }

  .logo svg {
    width: 19px;
    height: 19px;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .brand-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand h1 {
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .model-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 1px;
  }

  .dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }

  .pill-link {
    height: 36px;
    padding: 0 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-soft);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.18s ease;
  }

  .pill-link:hover {
    border-color: var(--line-strong);
    background: var(--surface-2);
    color: var(--text);
    transform: translateY(-1px);
  }

  .pill-link.donate {
    background: rgba(245, 158, 11, 0.12);
    color: #fbbf24;
    border-color: rgba(245, 158, 11, 0.3);
  }

  :root[data-theme="light"] .pill-link.donate {
    color: #b45309;
    background: rgba(245, 158, 11, 0.14);
  }

  .pill-link.donate:hover {
    background: rgba(245, 158, 11, 0.2);
    border-color: rgba(245, 158, 11, 0.5);
  }

  .pill-link svg {
    width: 15px;
    height: 15px;
    flex: none;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-soft);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.18s ease;
    flex: none;
  }

  .icon-btn:hover {
    border-color: var(--line-strong);
    background: var(--surface-2);
    color: var(--text);
  }

  .icon-btn svg {
    width: 17px;
    height: 17px;
  }

  /* ---------- Main Chat Stream (Full-Width Scroll Container) ---------- */
  main {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  #chat {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    padding: 28px clamp(16px, 4vw, 64px) 32px;
    scroll-behavior: smooth;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  #chat::-webkit-scrollbar {
    width: 7px;
  }

  #chat::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border-radius: 6px;
  }

  /* ---------- Natural Welcome Dashboard ---------- */
  .welcome {
    margin: auto;
    width: 100%;
    max-width: 960px;
    padding: 24px 12px;
    animation: fadeUp 0.45s ease both;
  }

  .welcome-head {
    text-align: center;
    margin-bottom: 32px;
  }

  .welcome-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 99px;
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-soft);
    margin-bottom: 16px;
  }

  .welcome-badge span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  .welcome h2 {
    font-size: clamp(24px, 3.2vw, 36px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    color: var(--text);
  }

  .welcome p {
    color: var(--muted);
    margin: 10px auto 0;
    max-width: 580px;
    font-size: 15px;
    line-height: 1.65;
  }

  .chips {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    width: 100%;
  }

  .chip {
    text-align: left;
    padding: 16px 18px;
    border-radius: var(--radius-md);
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    font: 500 13.5px/1.45 'Plus Jakarta Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: var(--shadow-sm);
  }

  .chip-icon {
    font-size: 18px;
  }

  .chip-title {
    font-weight: 600;
    color: var(--text);
  }

  .chip-sub {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  .chip:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    background: var(--surface-2);
    box-shadow: var(--shadow-md);
  }

  /* ---------- Messages (Wide & Balanced across PC Monitors) ---------- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .msg-row {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 14px;
    animation: fadeUp 0.28s ease both;
  }

  .msg-row.user {
    flex-direction: row-reverse;
  }

  .avatar {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 11.5px;
    font-weight: 700;
    margin-top: 2px;
  }

  .msg-row.bot .avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }

  .msg-row.user .avatar {
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    color: var(--text-soft);
  }

  .bubble {
    padding: 14px 18px;
    border-radius: var(--radius-lg);
    line-height: 1.72;
    font-size: 15px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    position: relative;
  }

  .msg-row.bot .bubble {
    flex: 1;
    max-width: min(92%, 1040px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-top-left-radius: 6px;
    box-shadow: var(--shadow-sm);
  }

  .msg-row.user .bubble {
    max-width: min(80%, 780px);
    background: var(--user-bubble);
    color: var(--user-text);
    border-top-right-radius: 6px;
    box-shadow: 0 8px 22px -8px rgba(37, 99, 235, 0.5);
    white-space: pre-wrap;
  }

  .bubble.err {
    border-color: rgba(239, 68, 68, 0.45);
    color: #fca5a5;
    background: rgba(239, 68, 68, 0.08);
  }

  :root[data-theme="light"] .bubble.err {
    color: #b91c1c;
    background: rgba(254, 202, 202, 0.5);
  }

  /* ---------- Markdown Content ---------- */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0.65em 0; }
  .md h1, .md h2, .md h3 { margin: 1.1em 0 0.45em; line-height: 1.3; font-weight: 700; }
  .md h1 { font-size: 1.35em; }
  .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.06em; }
  .md ul, .md ol { margin: 0.55em 0 0.55em 1.35em; }
  .md li { margin: 0.3em 0; }
  .md a { color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px; }
  .md blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.3em 1em;
    color: var(--muted);
    margin: 0.8em 0;
    background: rgba(99, 102, 241, 0.05);
    border-radius: 0 8px 8px 0;
  }
  .md code {
    font: 500 0.87em 'JetBrains Mono', monospace;
    background: rgba(99, 102, 241, 0.14);
    padding: 0.18em 0.45em;
    border-radius: 6px;
  }
  .md table {
    border-collapse: collapse;
    margin: 0.9em 0;
    width: 100%;
    overflow-x: auto;
    display: block;
    font-size: 0.92em;
  }
  .md th, .md td {
    border: 1px solid var(--line-strong);
    padding: 8px 13px;
    text-align: left;
  }
  .md th { background: var(--surface-2); font-weight: 600; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 1.1em 0; }

  .codewrap {
    margin: 0.85em 0;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--line-strong);
    background: #0d1117;
  }
  .codebar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    font: 500 11.5px 'JetBrains Mono', monospace;
    color: #9ca3af;
    background: #161b22;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .copy {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #e5e7eb;
    border-radius: 6px;
    padding: 3px 10px;
    font: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy:hover {
    border-color: var(--accent-2);
    color: var(--accent-2);
  }
  .codewrap pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
  .codewrap code { background: none; padding: 0; font-size: 13px; color: #e6edf3; }

  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
    30% { transform: translateY(-6px); opacity: 1; }
  }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 1.05em;
    background: var(--accent-2);
    margin-left: 3px;
    vertical-align: -2px;
    animation: blink 1s infinite;
    border-radius: 2px;
  }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* ---------- Bottom Composer Area ---------- */
  .composer-wrap {
    width: 100%;
    padding: 12px clamp(16px, 4vw, 64px) calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--bg);
    flex: none;
  }

  .composer-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .composer:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md);
  }

  textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font: 400 15px/1.55 'Plus Jakarta Sans', sans-serif;
    padding: 6px 6px;
    max-height: 180px;
  }

  textarea::placeholder {
    color: var(--muted);
  }

  .send {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.18s ease;
    flex: none;
  }

  .send:hover:not(:disabled) {
    background: #4f46e5;
    transform: translateY(-1px);
  }

  .send:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .send.stop {
    background: var(--danger);
  }

  .send svg {
    width: 18px;
    height: 18px;
  }

  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 9px;
    padding: 0 4px;
  }

  .footer-links {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .footer-links a {
    color: var(--text-soft);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.15s;
  }

  .footer-links a:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  /* ---------- Mobile & Tablet Responsiveness ---------- */
  .backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 25;
    backdrop-filter: blur(3px);
  }

  @media (max-width: 960px) {
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 295px;
      margin-left: 0 !important;
      transform: translateX(-100%);
      box-shadow: var(--shadow-md);

    }

  }

  @media (max-width: 600px) {
    #chat {
      padding: 18px 12px 24px;
      gap: 16px;
    }
    .composer-wrap {
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .msg-row.bot .bubble,
    .msg-row.user .bubble {

      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat"), form = $("#form"), input = $("#input"), sendBtn = $("#sendBtn");
const convListEl = $("#convList"), sidebar = $("#sidebar"), backdrop = $("#backdrop"), layout = $("#layout");
const searchInput = $("#searchInput");
const SEND_ICON = sendBtn.innerHTML;
const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';

const SUGGESTIONS = [
  { icon: "☁️", title: "Konsep Cloud Computing", sub: "Jelaskan perbedaan IaaS, PaaS, FaaS, dan SaaS beserta contohnya", prompt: "Jelaskan perbedaan IaaS, PaaS, FaaS, dan SaaS dalam Cloud Computing beserta contohnya" },
  { icon: "🗄️", title: "CRUD Database SQLite", sub: "Buatkan contoh implementasi CRUD SQLite menggunakan Node.js", prompt: "Buatkan contoh implementasi CRUD SQLite yang rapi menggunakan Node.js" },
  { icon: "⚡", title: "Optimasi Kode JavaScript", sub: "Buatkan fungsi debounce & throttle beserta penjelasannya", prompt: "Buatkan fungsi JavaScript untuk debounce dan throttle beserta cara pakainya" },
  { icon: "🚀", title: "Arsitektur Serverless", sub: "Bagaimana cara kerja Serverless Function di Vercel?", prompt: "Jelaskan bagaimana cara kerja arsitektur Serverless Function di Vercel dan keuntungannya" }
];

let currentConvId = null;
let history = [];
let conversations = [];
let searchQuery = "";
let controller = null;
let busy = false;

/* ---------- Responsive Sidebar Toggle (PC & Mobile) ---------- */
function toggleSidebar(forceOpen) {
  const isMobile = window.matchMedia("(max-width: 960px)").matches;
  if (isMobile) {
    const isOpen = typeof forceOpen === "boolean" ? forceOpen : !sidebar.classList.contains("open");
    sidebar.classList.toggle("open", isOpen);
    backdrop.classList.toggle("open", isOpen);
  } else {
    const collapsed = typeof forceOpen === "boolean" ? !forceOpen : !layout.classList.contains("sidebar-collapsed");
    layout.classList.toggle("sidebar-collapsed", collapsed);
  }
}
$("#menuBtn").onclick = () => toggleSidebar();
backdrop.onclick = () => toggleSidebar(false);

/* ---------- Tema ---------- */
const root = document.documentElement;
root.dataset.theme = localStorage.getItem("nova-theme") || "dark";
$("#themeBtn").onclick = () => {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("nova-theme", root.dataset.theme);
};

/* ---------- Markdown ---------- */
function renderMD(text) {
  const html = DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }));
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  tmp.querySelectorAll("pre").forEach((pre) => {
    const code = pre.querySelector("code");
    const lang = ([...(code?.classList || [])].find((c) => c.startsWith("language-")) || "").replace("language-", "") || "code";
    if (code && window.hljs) { try { hljs.highlightElement(code); } catch {} }
    const wrap = document.createElement("div");
    wrap.className = "codewrap";
    wrap.innerHTML = `<div class="codebar"><span>${lang}</span><button type="button" class="copy">Salin Kode</button></div>`;
    pre.replaceWith(wrap);
    wrap.appendChild(pre);
  });
  return tmp.innerHTML;
}
chat.addEventListener("click", (e) => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  const code = btn.closest(".codewrap").querySelector("code").innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "Tersalin ✓";
    setTimeout(() => (btn.textContent = "Salin Kode"), 1500);
  });
});

/* ---------- SQLite CRUD API & Local Backup ---------- */
function saveLocalBackup() {
  try {
    localStorage.setItem("nova-conv-backup", JSON.stringify(conversations));
  } catch {}
}

function getLocalBackup() {
  try {
    return JSON.parse(localStorage.getItem("nova-conv-backup") || "[]");
  } catch { return []; }
}

// READ ALL: Ambil daftar riwayat dari SQLite
async function loadConversations() {
  try {
    const res = await fetch("/api/history");
    if (!res.ok) throw new Error("Gagal memuat SQLite");
    const data = await res.json();
    if (data.engine) {
      $("#dbBadge").textContent = data.engine.includes("sqlite") ? "SQLite3" : "SQLite";
    }
    conversations = Array.isArray(data.conversations) ? data.conversations : [];
    saveLocalBackup();
  } catch {
    conversations = getLocalBackup();
  }
  renderConversationList();
}

function formatDate(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  } catch { return ""; }
}

function renderConversationList() {
  const q = searchQuery.trim().toLowerCase();
  const filtered = q
    ? conversations.filter((c) => (c.title || "").toLowerCase().includes(q))
    : conversations;

  if (!filtered.length) {
    convListEl.innerHTML = `<div class="conv-empty">${q ? "Tidak ada riwayat yang cocok." : "Belum ada riwayat percakapan.<br/>Mulai chat baru dengan NOVA!"}</div>`;
    return;
  }

  convListEl.innerHTML = filtered.map((c) => `
    <div class="conv-item ${c.id === currentConvId ? "active" : ""}" data-id="${c.id}">
      <div class="conv-info">
        <div class="conv-name">${escapeHtml(c.title || "Percakapan Baru")}</div>
        <div class="conv-meta">
          <span>${c.message_count ?? (c.messages?.length || 0)} pesan</span>
          <span>·</span>
          <span>${formatDate(c.updated_at)}</span>
        </div>
      </div>
      <div class="conv-actions">
        <button type="button" class="mini-btn edit" data-id="${c.id}" title="Ubah Judul (Update)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button type="button" class="mini-btn del" data-id="${c.id}" title="Hapus Riwayat (Delete)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>
  `).join("");
}

searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value;
  renderConversationList();
});

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

// Event delegasi pada daftar riwayat (Select, Rename/UPDATE, Delete/DELETE)
convListEl.addEventListener("click", async (e) => {
  const editBtn = e.target.closest(".mini-btn.edit");
  if (editBtn) {
    e.stopPropagation();
    const id = editBtn.dataset.id;
    const conv = conversations.find((c) => c.id === id);
    const newTitle = prompt("Ubah judul percakapan:", conv?.title || "");
    if (newTitle && newTitle.trim()) {
      await renameConversation(id, newTitle.trim());
    }
    return;
  }

  const delBtn = e.target.closest(".mini-btn.del");
  if (delBtn) {
    e.stopPropagation();
    const id = delBtn.dataset.id;
    if (confirm("Hapus percakapan ini dari database SQLite?")) {
      await removeConversation(id);
    }
    return;
  }

  const item = e.target.closest(".conv-item");
  if (item) {
    const id = item.dataset.id;
    await selectConversation(id);
    if (window.matchMedia("(max-width: 960px)").matches) {
      toggleSidebar(false);
    }
  }
});

// READ ONE: Buka percakapan dari SQLite
async function selectConversation(id) {
  if (busy) controller?.abort();
  currentConvId = id;
  renderConversationList();
  try {
    const res = await fetch(`/api/history?id=${encodeURIComponent(id)}`);
    if (!res.ok) throw new Error("Not found");
    const data = await res.json();
    const msgs = data.conversation?.messages || [];
    history = msgs.map((m) => ({ role: m.role, content: m.content }));
    chat.innerHTML = "";
    if (history.length === 0) {
      showWelcome();
    } else {
      for (const m of history) {
        const b = addMessage(m.role, m.content);
        if (m.role === "assistant") {
          b.classList.add("md");
          b.innerHTML = renderMD(m.content);
        }
      }
    }
  } catch {
    showWelcome();
  }
}

// UPDATE: Ubah judul percakapan di SQLite
async function renameConversation(id, title) {
  try {
    const res = await fetch("/api/history", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, title }),
    });
    if (res.ok) {
      await loadConversations();
    }
  } catch {}
}

// DELETE: Hapus 1 percakapan di SQLite
async function removeConversation(id) {
  try {
    await fetch(`/api/history?id=${encodeURIComponent(id)}`, { method: "DELETE" });
  } catch {}
  conversations = conversations.filter((c) => c.id !== id);
  saveLocalBackup();
  if (currentConvId === id) {
    startNewChat();
  } else {
    renderConversationList();
  }
}

// DELETE ALL: Hapus semua percakapan di SQLite
$("#clearAllBtn").onclick = async () => {
  if (!conversations.length) return;
  if (!confirm("Yakin ingin menghapus seluruh riwayat percakapan di database SQLite?")) return;
  try {
    await fetch("/api/history?all=true", { method: "DELETE" });
  } catch {}
  conversations = [];
  saveLocalBackup();
  startNewChat();
};

/* ---------- UI helpers ---------- */
function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function showWelcome() {
  chat.innerHTML = `
    <div class="welcome">
      <div class="welcome-head">
        <div class="welcome-badge"><span></span>Powered by Gemini 2.5 & SQLite CRUD</div>
        <h2>Halo, ada yang bisa NOVA bantu hari ini?</h2>
        <p>Tanyakan seputar pemrograman, arsitektur Cloud Computing, analisis data, atau mulai diskusi baru. Semua riwayat tersimpan rapi.</p>
      </div>
      <div class="chips">
        ${SUGGESTIONS.map((s, idx) => `
          <button type="button" class="chip" data-idx="${idx}">
            <span class="chip-icon">${s.icon}</span>
            <span class="chip-title">${s.title}</span>
            <span class="chip-sub">${s.sub}</span>
          </button>
        `).join("")}
      </div>
    </div>`;
  chat.querySelectorAll(".chip").forEach((c) => {
    c.onclick = () => {
      const item = SUGGESTIONS[Number(c.dataset.idx)];
      if (item) send(item.prompt);
    };
  });
}

function addMessage(role, content = "") {
  chat.querySelector(".welcome")?.remove();
  const el = document.createElement("div");
  el.className = `msg-row ${role === "user" ? "user" : "bot"}`;
  el.innerHTML = `<div class="avatar">${role === "user" ? "YOU" : "AI"}</div><div class="bubble"></div>`;
  const bubble = el.querySelector(".bubble");
  if (role === "user") bubble.textContent = content;
  chat.appendChild(el);
  scrollDown();
  return bubble;
}

function setBusy(v) {
  busy = v;
  sendBtn.classList.toggle("stop", v);
  sendBtn.innerHTML = v ? STOP_ICON : SEND_ICON;
  sendBtn.setAttribute("aria-label", v ? "Hentikan" : "Kirim");
}

function startNewChat() {
  controller?.abort();
  currentConvId = null;
  history = [];
  showWelcome();
  renderConversationList();
  input.focus();
}

/* ---------- Kirim pesan ---------- */
async function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;

  // CREATE conversation di SQLite jika ini pesan pertama
  if (!currentConvId) {
    currentConvId = `conv_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    try {
      await fetch("/api/history", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: currentConvId, title: text.slice(0, 52) }),
      });
    } catch {}
  }

  addMessage("user", text);
  history.push({ role: "user", content: text });
  input.value = ""; autoGrow();

  const bubble = addMessage("assistant");
  bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  setBusy(true);
  controller = new AbortController();

  let full = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversationId: currentConvId, messages: history }),
      signal: controller.signal,
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `Server error (${res.status})`);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    bubble.classList.add("md");
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      full += dec.decode(value, { stream: true });
      bubble.innerHTML = renderMD(full) + '<span class="cursor"></span>';
      scrollDown();
    }
    full += dec.decode();
    bubble.innerHTML = renderMD(full || "_(tidak ada balasan)_");
    history.push({ role: "assistant", content: full });
    await loadConversations();
  } catch (err) {
    if (err.name === "AbortError") {
      bubble.classList.add("md");
      bubble.innerHTML = renderMD(full ? full + "\n\n_⏹ dihentikan_" : "_⏹ dihentikan_");
      if (full) {
        history.push({ role: "assistant", content: full });
        fetch("/api/history", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "add_message", conversationId: currentConvId, role: "assistant", content: full }),
        }).then(() => loadConversations()).catch(() => {});
      } else {
        history.pop();
      }
    } else {
      bubble.classList.add("err");
      bubble.textContent = "⚠️ " + err.message;
      history.pop();
    }
  } finally {
    setBusy(false);
    controller = null;
    scrollDown();
    input.focus();
  }
}

/* ---------- Events ---------- */
form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy) { controller?.abort(); return; }
  send(input.value);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
});
function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", autoGrow);
$("#clearBtn").onclick = startNewChat;
$("#newChatSideBtn").onclick = () => {
  startNewChat();
  if (window.matchMedia("(max-width: 960px)").matches) toggleSidebar(false);
};

showWelcome();
loadConversations();
</script>
